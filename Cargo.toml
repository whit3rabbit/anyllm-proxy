[workspace]
members = [
    "crates/translator",
    "crates/client",
    "crates/batch_engine",
    "crates/proxy",
    "crates/providers",
    "crates/pxpipe",
    "crates/rtk",
    "crates/optimizer/crates/optimize-core",
    "crates/optimizer/crates/optimize-passes",
    "crates/optimizer/crates/optimize-scorer",
    "crates/optimizer/optimize-cli",
    "crates/optimizer/benches",
]
resolver = "2"

[workspace.package]
version = "0.13.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/whit3rabbit/anyllm-proxy"
